<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 加二的相册 ✨</title>
<style>
  :root {
    --pink: #ffb8c6;
    --pink-light: #ffe0e6;
    --pink-dark: #ff8fa3;
    --lavender: #d4b8d4;
    --lavender-light: #f0e6f0;
    --bg: #fff5f7;
    --card-bg: #ffffff;
    --text: #5c4b51;
    --text-light: #9a8c91;
    --shadow: 0 4px 20px rgba(255, 143, 163, 0.15);
    --shadow-hover: 0 8px 30px rgba(255, 143, 163, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,184,198,0.15) 0%, transparent 50%),
      radial-gradient(circle at 85% 60%, rgba(212,184,212,0.15) 0%, transparent 50%),
      radial-gradient(circle at 40% 80%, rgba(255,224,230,0.2) 0%, transparent 50%);
  }

  /* ---- header ---- */
  header {
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
  }

  .logo-icon {
    font-size: 56px;
    display: block;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--pink-dark);
    margin-top: 12px;
    letter-spacing: 2px;
  }

  header p {
    color: var(--text-light);
    margin-top: 8px;
    font-size: 1rem;
  }

  .decorative-line {
    display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px;
  }
  .decorative-line span { font-size: 18px; }
  .decorative-line::before, .decorative-line::after {
    content: ''; width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--pink));
    border-radius: 1px;
  }
  .decorative-line::after {
    background: linear-gradient(90deg, var(--pink), transparent);
  }

  /* ---- gallery ---- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 28px;
    padding: 20px 40px 60px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    cursor: pointer;
    position: relative;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, var(--pink-light), var(--lavender-light));
    transition: transform 0.4s ease;
  }

  .card:hover .card-img { transform: scale(1.04); }

  /* placeholder image when no src */
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    color: var(--pink);
    background: linear-gradient(135deg, var(--pink-light), var(--lavender-light));
    transition: transform 0.4s ease;
  }

  .card:hover .card-img-placeholder { transform: scale(1.04); }

  .card-body {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }

  /* ---- like button ---- */
  .like-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 2px solid var(--pink-light);
    border-radius: 30px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--pink-dark);
    transition: all 0.3s ease;
    user-select: none;
    white-space: nowrap;
  }

  .like-btn:hover {
    background: var(--pink-light);
    border-color: var(--pink);
  }

  .like-btn.liked {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .like-btn .heart {
    font-size: 1.1rem;
    transition: transform 0.3s ease;
  }

  .like-btn.liked .heart {
    animation: heartbeat 0.5s ease;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(0.95); }
    75% { transform: scale(1.2); }
  }

  .like-count {
    font-weight: 600;
    min-width: 20px;
    text-align: center;
  }

  /* ---- floating hearts ---- */
  .floating-heart {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    animation: floatUp 1.2s ease-out forwards;
    z-index: 999;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
    30% { opacity: 1; transform: translateY(-30px) scale(1.2) rotate(10deg); }
    100% { opacity: 0; transform: translateY(-160px) scale(0.3) rotate(-20deg); }
  }

  /* ---- lightbox ---- */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(92, 75, 81, 0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
  }

  .lightbox.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 16px;
    box-shadow: 0 12px 60px rgba(0,0,0,0.3);
    animation: zoomIn 0.35s ease;
  }

  @keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 32px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    font-size: 32px;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.35); }

  .lightbox-caption {
    position: absolute;
    bottom: 32px;
    color: #fff;
    font-size: 1rem;
    text-align: center;
  }

  /* ---- upload section ---- */
  .upload-section {
    text-align: center;
    padding: 0 40px 20px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 40px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 16px rgba(255,143,163,0.3);
  }

  .upload-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(255,143,163,0.45);
  }

  .upload-hint {
    color: var(--text-light);
    font-size: 0.85rem;
    margin-top: 10px;
  }

  /* ---- stats bar ---- */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 0 40px 10px;
    flex-wrap: wrap;
  }

  .stat-item {
    text-align: center;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 28px;
    box-shadow: var(--shadow);
  }

  .stat-number {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--pink-dark);
  }

  .stat-label {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 4px;
  }

  /* ---- footer ---- */
  footer {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 0.85rem;
  }

  footer .hearts { font-size: 18px; display: block; margin-bottom: 6px; }

  /* ---- responsive ---- */
  @media (max-width: 768px) {
    .gallery {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 12px 16px 40px;
    }

    header h1 { font-size: 1.6rem; }
    header { padding: 36px 16px 24px; }

    .stats-bar { gap: 12px; }
    .stat-item { padding: 12px 18px; }
    .stat-number { font-size: 1.3rem; }
  }

  @media (max-width: 480px) {
    .gallery {
      grid-template-columns: 1fr;
      padding: 8px 12px 40px;
    }
    header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header>
  <span class="logo-icon">📷</span>
  <h1>加二的相册</h1>
  <p>每一张照片，都是时光的标本 ✦</p>
  <div class="decorative-line"><span>🌸</span></div>
</header>

<div class="stats-bar">
  <div class="stat-item">
    <div class="stat-number" id="totalPhotos">0</div>
    <div class="stat-label">作品</div>
  </div>
  <div class="stat-item">
    <div class="stat-number" id="totalLikes">0</div>
    <div class="stat-label">❤ 总赞数</div>
  </div>
</div>

<div class="upload-section">
  <label class="upload-btn" for="photoUpload">
    📁 添加你的照片作品
  </label>
  <input type="file" id="photoUpload" accept="image/*" multiple hidden>
  <p class="upload-hint">支持 JPG / PNG / WebP，可多选</p>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img src="" alt="" id="lightboxImg">
</div>

<footer>
  <span class="hearts">💖 🧸 💖</span>
  <p>谢谢你来欣赏我的作品 ~</p>
</footer>

<script>
  (function() {
    const STORAGE_KEY = 'photo_gallery_data';
    const galleryEl = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const totalPhotosEl = document.getElementById('totalPhotos');
    const totalLikesEl = document.getElementById('totalLikes');
    const uploadInput = document.getElementById('photoUpload');

    // ---- data layer ----
    function loadPhotos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }

    function savePhotos(photos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
    }

    let photos = loadPhotos();

    // ---- render ----
    function updateStats() {
      totalPhotosEl.textContent = photos.length;
      const total = photos.reduce((sum, p) => sum + (p.likes || 0), 0);
      totalLikesEl.textContent = total;
    }

    function render() {
      if (photos.length === 0) {
        galleryEl.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-light)">
            <div style="font-size:64px;margin-bottom:16px">🖼️</div>
            <p style="font-size:1.1rem">还没有作品哦～ 点击上方按钮来添加你的第一张照片吧！</p>
          </div>`;
      } else {
        galleryEl.innerHTML = photos.map((photo, idx) => `
          <div class="card" data-index="${idx}">
            ${photo.dataUrl
              ? `<img class="card-img" src="${photo.dataUrl}" alt="${escHtml(photo.title)}" loading="lazy">`
              : `<div class="card-img-placeholder">📷</div>`}
            <div class="card-body">
              <span class="card-title">${escHtml(photo.title)}</span>
              <button class="like-btn ${photo.liked ? 'liked' : ''}" data-index="${idx}">
                <span class="heart">${photo.liked ? '💖' : '🤍'}</span>
                <span class="like-count">${photo.likes || 0}</span>
              </button>
            </div>
          </div>
        `).join('');
      }
      updateStats();
    }

    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- likes ----
    galleryEl.addEventListener('click', function(e) {
      const likeBtn = e.target.closest('.like-btn');
      if (likeBtn) {
        e.stopPropagation();
        const idx = parseInt(likeBtn.dataset.index);
        toggleLike(idx, likeBtn);
        return;
      }

      const card = e.target.closest('.card');
      if (card) {
        const idx = parseInt(card.dataset.index);
        openLightbox(idx);
      }
    });

    function toggleLike(idx, btnEl) {
      const photo = photos[idx];
      photo.liked = !photo.liked;
      photo.likes = (photo.likes || 0) + (photo.liked ? 1 : -1);

      if (photo.liked && btnEl) {
        spawnFloatingHearts(btnEl);
      }

      savePhotos(photos);
      render();
    }

    function spawnFloatingHearts(btnEl) {
      const rect = btnEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top;
      const hearts = ['💕', '💖', '💗', '💝', '✨', '💘'];

      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.className = 'floating-heart';
          heart.textContent = hearts[i % hearts.length];
          heart.style.left = (cx + (Math.random() - 0.5) * 80) + 'px';
          heart.style.top = cy + 'px';
          heart.style.animationDuration = (1 + Math.random() * 0.8) + 's';
          document.body.appendChild(heart);
          heart.addEventListener('animationend', () => heart.remove());
        }, i * 60);
      }
    }

    // ---- lightbox ----
    function openLightbox(idx) {
      const photo = photos[idx];
      if (!photo.dataUrl) return;
      lightboxImg.src = photo.dataUrl;
      lightboxImg.alt = photo.title;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });

    // ---- upload ----
    uploadInput.addEventListener('change', function() {
      const files = Array.from(this.files);
      if (files.length === 0) return;

      let loaded = 0;
      files.forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          photos.push({
            id: Date.now() + Math.random(),
            title: file.name.replace(/\.[^.]+$/, ''),
            dataUrl: e.target.result,
            likes: 0,
            liked: false,
          });
          loaded++;
          if (loaded === files.length || loaded === files.filter(f => f.type.startsWith('image/')).length) {
            savePhotos(photos);
            render();
          }
        };
        reader.readAsDataURL(file);
      });
      this.value = '';
    });

    // ---- init ----
    render();
  })();
</script>

</body>
</html>
